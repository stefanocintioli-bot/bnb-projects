name: BNBAgent DCA — Monthly Cycle

# Runs at 12:00 UTC on the 15th of every month.
# Can also be triggered manually from the Actions tab (with dry-run toggle).
on:
  schedule:
    - cron: '0 12 15 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (no swap, no setMetadata, no Telegram)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  dca-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r dca-bnbagent/requirements.txt

      - name: Restore keystore from secret
        env:
          KEYSTORE_JSON: ${{ secrets.BNBAGENT_KEYSTORE_JSON }}
        run: |
          mkdir -p ~/.bnbagent/wallets
          echo "$KEYSTORE_JSON" > ~/.bnbagent/wallets/${{ secrets.BNBAGENT_WALLET_ADDRESS }}.json
          ls -la ~/.bnbagent/wallets/

      - name: Run DCA cycle
        working-directory: dca-bnbagent
        env:
          NETWORK:                  bsc-testnet
          BNBAGENT_WALLET_ADDRESS:  ${{ secrets.BNBAGENT_WALLET_ADDRESS }}
          WALLET_PASSWORD:          ${{ secrets.BNBAGENT_WALLET_PASSWORD }}
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          RPC_URL:                  ${{ secrets.RPC_URL }}
          DRY_RUN:                  ${{ github.event.inputs.dry_run || 'false' }}
        run: python dca_runner.py

      - name: Notify on workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=🔴 BNBAgent workflow FAILED ($(date -u '+%Y-%m-%d %H:%M UTC'))%0A${RUN_URL}" \
            -d "disable_web_page_preview=true"
